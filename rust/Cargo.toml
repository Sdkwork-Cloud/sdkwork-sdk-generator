[package]
name = "sdkwork-sdk-generator-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust client library for integrating with the SDKWork SDK Generator HTTP API"
repository = "https://github.com/sdkwork/spring-ai-plus"
homepage = "https://github.com/sdkwork/spring-ai-plus"
readme = "README.md"

[lib]
name = "sdkwork_sdk_generator"
path = "src/lib.rs"

[dependencies]
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
